# rockif_config.yml
# github.com/shenjuexiao
# 20261115

# github.com/pages-themes/midnight
# _config.yml

# The title of your site
title: ROCKIF · 肉层
# A short description of your site's purpose
description: 音乐资源分享。

url: "https://rockif.com"
baseurl: ""
timezone: Asia/Shanghai

# true or false (unquoted) to indicate whether to provide a download URL
show_downloads: false
# Your Google Analytics tracking ID
google_analytics:

remote_theme: pages-themes/midnight@v0.2.0
# add this line to the plugins list if you already have one
plugins:
  - jekyll-github-metadata
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# 链接
permalink: pretty

# 包含的文件（Jekyll 默认会忽略以下划线开头的文件，
# 但这里列出的文件需要被处理）
include:
  - README.md
  
# 排除的文件和目录（不参与 Jekyll 构建）
exclude:
  - _config.yml
  - .github/
  
